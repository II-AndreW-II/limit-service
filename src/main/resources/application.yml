spring:
  application:
    name: limit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:limits}
    username: ${DB_USER:limits}
    password: ${DB_PASSWORD:limits}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Almaty
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  autoconfigure:
    exclude: ${REDIS_AUTOCONFIG_EXCLUDE:}

server:
  port: ${SERVER_PORT:8080}

app:
  redis:
    enabled: ${REDIS_ENABLED:false}
  exchange-rate:
    provider: twelvedata
    base-url: ${EXCHANGE_RATE_BASE_URL:https://api.twelvedata.com}
    api-key: ${EXCHANGE_RATE_API_KEY:demo}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bank.limitservice: INFO
    org.springframework.web: INFO
